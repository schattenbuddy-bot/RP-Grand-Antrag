<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Good Boy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100vw;
      height: 100vh;
      position: relative;
      font-family: Arial, sans-serif;
    }

    .text {
      position: absolute;
      color: red;
      font-size: 5rem;
      font-weight: bold;
      text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red;
      white-space: nowrap;

      animation:
        blink 1.2s infinite alternate,
        move 40s infinite alternate ease-in-out;
    }

    @keyframes blink {
      0% {
        opacity: 1;
        filter: brightness(1);
      }

      50% {
        opacity: 0.4;
        filter: brightness(2);
      }

      100% {
        opacity: 1;
        filter: brightness(1.2);
      }
    }

    @keyframes move {
      0% {
        top: 5%;
        left: 5%;
      }

      20% {
        top: 20%;
        left: 70%;
      }

      40% {
        top: 70%;
        left: 60%;
      }

      60% {
        top: 50%;
        left: 10%;
      }

      80% {
        top: 80%;
        left: 75%;
      }

      100% {
        top: 10%;
        left: 40%;
      }
    }
  </style>
</head>

<body>
  <div class="text">Good Boy</div>
</body>
</html>
